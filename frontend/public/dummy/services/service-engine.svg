<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gEng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gEng)"/>
  <!-- Engine block vector -->
  <rect x="220" y="140" width="160" height="110" rx="8" fill="#3f3f46" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="260" cy="180" r="18" fill="#52525b" stroke="#71717a" stroke-width="3"/>
  <circle cx="340" cy="180" r="18" fill="#52525b" stroke="#71717a" stroke-width="3"/>
  <!-- Spark & Steam degreasing -->
  <path d="M 190 190 L 220 180" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 380 180 L 410 190" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 280 110 Q 300 90 320 110" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
  <!-- Badge -->
  <rect x="30" y="30" width="170" height="34" rx="8" fill="#d97706" opacity="0.8"/>
  <text x="45" y="53" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">ENGINE DETAILING</text>
  <text x="300" y="340" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">Safe Steam &amp; Degreasing</text>
  <text x="300" y="365" text-anchor="middle" fill="#fde68a" font-size="13" font-family="sans-serif">Bebas Korsleting, Kerak Rontok, Selang Mengkilap</text>
</svg>
