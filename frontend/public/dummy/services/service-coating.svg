<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gCoat)"/>
  <!-- Diamond / Nano Shield Vector -->
  <polygon points="300,90 380,160 300,270 220,160" fill="none" stroke="#22d3ee" stroke-width="6"/>
  <polygon points="300,110 360,160 300,250 240,160" fill="#0891b2" opacity="0.35"/>
  <!-- Water Beading Hydrophobic Droplets on Shield -->
  <circle cx="280" cy="180" r="14" fill="#a5f3fc" opacity="0.9"/>
  <circle cx="320" cy="190" r="18" fill="#cffafe" opacity="0.95"/>
  <circle cx="300" cy="150" r="10" fill="#ffffff" opacity="0.9"/>
  <!-- 9H Hardness Badge -->
  <circle cx="300" cy="180" r="32" fill="#0f172a" stroke="#facc15" stroke-width="3"/>
  <text x="300" y="188" text-anchor="middle" fill="#facc15" font-size="22" font-weight="900" font-family="sans-serif">9H</text>
  <!-- Stars -->
  <polygon points="410,100 415,110 425,115 415,120 410,130 405,120 395,115 405,110" fill="#facc15"/>
  <!-- Badge -->
  <rect x="30" y="30" width="190" height="34" rx="8" fill="#0891b2" opacity="0.8"/>
  <text x="45" y="53" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">CERAMIC COATING</text>
  <text x="300" y="340" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">9H Diamond Nano Ceramic Coating</text>
  <text x="300" y="365" text-anchor="middle" fill="#a5f3fc" font-size="13" font-family="sans-serif">Wet-Look Deep Gloss, Efek Daun Talas, Garansi Resmi</text>
</svg>
