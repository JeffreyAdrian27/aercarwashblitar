<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gExt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gExt)"/>
  <!-- Busa salju foam effect -->
  <circle cx="150" cy="200" r="80" fill="#ffffff" opacity="0.1"/>
  <circle cx="450" cy="180" r="100" fill="#38bdf8" opacity="0.15"/>
  <!-- Mobil & foam bubbles -->
  <path d="M 120 280 Q 200 230 300 230 Q 420 230 480 280 Z" fill="#0284c7" opacity="0.7"/>
  <!-- High pressure nozzle & bubbles -->
  <circle cx="280" cy="160" r="22" fill="#ffffff" opacity="0.8"/>
  <circle cx="320" cy="140" r="14" fill="#e0f2fe" opacity="0.7"/>
  <circle cx="250" cy="180" r="18" fill="#bae6fd" opacity="0.9"/>
  <circle cx="360" cy="170" r="26" fill="#ffffff" opacity="0.85"/>
  <circle cx="300" cy="210" r="30" fill="#ffffff" opacity="0.9"/>
  <path d="M 220 120 Q 260 150 300 170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Water Splash drops -->
  <circle cx="390" cy="120" r="6" fill="#38bdf8"/>
  <circle cx="210" cy="140" r="8" fill="#bae6fd"/>
  <!-- Label -->
  <rect x="30" y="30" width="170" height="34" rx="8" fill="#0369a1" opacity="0.8"/>
  <text x="45" y="53" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">CUCI EKSTERIOR</text>
  <text x="300" y="340" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">Snow Foam & High Pressure Wash</text>
  <text x="300" y="365" text-anchor="middle" fill="#93c5fd" font-size="13" font-family="sans-serif">Busa Salju Aktif pH Netral Bebas Baret</text>
</svg>
