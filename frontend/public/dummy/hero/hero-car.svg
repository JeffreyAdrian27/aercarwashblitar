<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="50%" stop-color="#0b2342" />
      <stop offset="100%" stop-color="#040b17" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="waterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Studio Grid & Floor Reflection -->
  <g opacity="0.15">
    <line x1="0" y1="520" x2="1200" y2="520" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="570" x2="1200" y2="570" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#38bdf8" stroke-width="1" />
    <line x1="200" y1="520" x2="0" y2="700" stroke="#38bdf8" stroke-width="1" />
    <line x1="450" y1="520" x2="300" y2="700" stroke="#38bdf8" stroke-width="1" />
    <line x1="750" y1="520" x2="900" y2="700" stroke="#38bdf8" stroke-width="1" />
    <line x1="1000" y1="520" x2="1200" y2="700" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Atmospheric Glow -->
  <ellipse cx="600" cy="400" rx="450" ry="220" fill="url(#waterGlow)" />
  <ellipse cx="900" cy="250" rx="280" ry="150" fill="url(#waterGlow)" />

  <!-- Hydraulic & Car Studio Lighting Fixtures -->
  <rect x="250" y="40" width="700" height="12" rx="6" fill="#38bdf8" opacity="0.8" filter="url(#glow)" />
  <rect x="280" y="70" width="640" height="6" rx="3" fill="#ffffff" opacity="0.9" />

  <!-- Sleek Sports Car Silhouette -->
  <!-- Floor Shadow -->
  <ellipse cx="600" cy="545" rx="430" ry="32" fill="#020617" opacity="0.95" />

  <!-- Car Main Silhouette Body -->
  <path d="M 220 500 
           C 220 485, 240 460, 275 450 
           L 380 435 
           C 420 415, 480 340, 560 325 
           L 780 325 
           C 870 345, 930 420, 970 445 
           L 1000 470 
           C 1020 495, 1010 515, 980 520 
           L 240 520 
           Z" 
        fill="url(#carBody)" stroke="#0ea5e9" stroke-width="2" />

  <!-- Glossy Reflection Highlight Curve -->
  <path d="M 390 430 Q 560 335 770 335 Q 910 390 960 450" 
        fill="none" stroke="#e0f2fe" stroke-width="5" opacity="0.75" />

  <!-- Windshield & Windows -->
  <path d="M 490 420 
           L 560 345 
           L 750 345 
           L 820 420 
           Z" 
        fill="#07192e" stroke="#38bdf8" stroke-width="2" opacity="0.9" />

  <path d="M 570 355 L 730 355 L 700 415 L 560 415 Z" fill="#0ea5e9" opacity="0.25" />

  <!-- Headlight High-Tech Laser Beam -->
  <polygon points="230,480 270,470 270,490" fill="#38bdf8" filter="url(#glow)" />
  <path d="M 230 480 L 40 460 L 40 550 L 230 500 Z" fill="url(#waterGlow)" opacity="0.7" />

  <!-- Wheels & Rims -->
  <!-- Front Wheel -->
  <circle cx="370" cy="515" r="55" fill="#090d16" stroke="#475569" stroke-width="6" />
  <circle cx="370" cy="515" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <circle cx="370" cy="515" r="16" fill="#e2e8f0" />
  <!-- Caliper / Brake Disc -->
  <path d="M 350 495 A 30 30 0 0 1 390 495" stroke="#f59e0b" stroke-width="7" fill="none" />

  <!-- Rear Wheel -->
  <circle cx="850" cy="515" r="55" fill="#090d16" stroke="#475569" stroke-width="6" />
  <circle cx="850" cy="515" r="38" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <circle cx="850" cy="515" r="16" fill="#e2e8f0" />
  <path d="M 830 495 A 30 30 0 0 1 870 495" stroke="#f59e0b" stroke-width="7" fill="none" />

  <!-- Water Mist & Active Foam Splash Overlay -->
  <g opacity="0.75">
    <circle cx="320" cy="420" r="14" fill="#ffffff" opacity="0.8" />
    <circle cx="340" cy="405" r="8" fill="#bae6fd" opacity="0.9" />
    <circle cx="360" cy="430" r="12" fill="#e0f2fe" opacity="0.6" />
    <circle cx="680" cy="320" r="10" fill="#ffffff" opacity="0.7" />
    <circle cx="710" cy="310" r="6" fill="#bae6fd" opacity="0.9" />
    <circle cx="890" cy="430" r="15" fill="#ffffff" opacity="0.7" />
    <circle cx="915" cy="415" r="10" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Official aer DRIVE THRU CARWASH Badge Overlay -->
  <g transform="translate(900, 90)">
    <rect width="240" height="95" rx="16" fill="#070e1b" fill-opacity="0.9" stroke="#ffffff" stroke-width="2" />
    <text x="120" y="44" text-anchor="middle" fill="#ffffff" font-size="34" font-family="'Outfit', sans-serif" font-weight="900" font-style="italic" letter-spacing="2">aer</text>
    <rect x="20" y="55" width="95" height="26" rx="8" fill="#ffffff" />
    <text x="67.5" y="72" text-anchor="middle" fill="#070e1b" font-size="11" font-family="sans-serif" font-weight="900" letter-spacing="1">DRIVE THRU</text>
    <rect x="125" y="55" width="95" height="26" rx="8" fill="#ffffff" />
    <text x="172.5" y="72" text-anchor="middle" fill="#070e1b" font-size="11" font-family="sans-serif" font-weight="900" letter-spacing="1.5">CARWASH</text>
  </g>

  <!-- Sparkling Polish Glare Stars -->
  <g transform="translate(680, 360)">
    <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15" fill="#ffffff" filter="url(#glow)" />
  </g>
  <g transform="translate(340, 470)">
    <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
